      - "Remove \"split(\" from compat/tck_test.go's unsupportedPatterns"
    completed_at: "2026-09-24T00:00:00Z"
    resolution_note: |
      Generalised to any-length delimiter instead of the single-character
      restriction originally planned — LENGTH(d) replaces the trigger's
